<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Preview Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="card-container">
    <div class="product-card">
      <div class="product-image" role="img" aria-label="Gabrielle Essence perfume bottle on a wooden table with foliage"></div>
      
      <div class="product-content">
        <span class="product-category">Perfume</span>
        <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
        <p class="product-description">
          A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <div class="pricing">
          <span class="current-price">$149.99</span>
          <span class="original-price">$169.99</span>
        </div>

        <button class="add-to-cart-btn" id="addToCartBtn">
          <svg width="15" height="16" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.383 10.388a1.25 1.25 0 0 0-1.125-.763H4.85l-.367-2.188h9.342a1.25 1.25 0 0 0 1.217-.967l1.09-5.188A1.25 1.25 0 0 0 14.915 0H2.434l-.45-2.688A1.25 1.25 0 0 0 .75-3.75H0a1.25 1.25 0 0 0 0 2.5h.75l2.25 13.5a2.5 2.5 0 1 0 4.5 1.25h4a2.5 2.5 0 1 0 4.5-1.25c.01-.295-.08-.588-.267-.812ZM5 16a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Zm8 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Z" fill="currentColor"/>
          </svg>
          Add to Cart
        </button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
